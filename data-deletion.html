<h1>데이터<br><em>삭제</em> 안내</h1>
<p>113이 댓글 자동 DM을 위해 받은 정보(댓글 ID, 게시물 ID, 작성자 인스타그램 ID, 댓글 내용, 처리 시각)는 30일이 지나면 저절로 지워집니다. 그 전에 지우고 싶으면 아래처럼 요청해 주세요.</p>
<h2>요청 방법</h2>
<ul><li>1. 인스타그램 <a href="https://www.instagram.com/113kong.ai/">@113kong.ai</a>에 DM을 보냅니다.</li><li>2. 내용에 “데이터 삭제”라고 적습니다.</li><li>3. 7일 안에 지우고, 지웠다고 DM으로 답합니다.</li></ul>
<p>처리 방침 전체는 <a href="privacy.html">개인정보처리방침</a>에 있습니다.</p>
